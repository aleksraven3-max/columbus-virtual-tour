<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Віртуальний тур МКС — Модуль «Колумб»</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b0b;
            font-family: Arial, sans-serif;
        }
        .header-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 15, 30, 0.9);
            color: #ffffff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-bottom: 1px solid rgba(0, 170, 255, 0.3);
            font-size: 14px;
        }
        .header-bar h1 {
            font-size: 16px;
            color: #00aaff;
        }
        .tour-container {
            position: absolute;
            top: 45px;
            left: 0;
            width: 100%;
            height: calc(100% - 45px);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>Науковий модуль «Колумб» (Columbus) — МКС</h1>
        <span>Європейське космічне агентство (ESA)</span>
    </div>

    <div class="tour-container">
        <iframe 
            src="https://esamultimedia.esa.int/multimedia/virtual-tour-columbus/" 
            allowfullscreen="true" 
            webkitallowfullscreen="true" 
            mozallowfullscreen="true">
        </iframe>
    </div>

</body>
</html>
