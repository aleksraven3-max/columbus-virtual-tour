<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Віртуальний тур МКС — Модуль «Колумб» (Українською)</title>
    
    <!-- Бібліотека Pannellum для 360-панорам -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b0b;
            font-family: Arial, Helvetica, sans-serif;
        }
        #panorama {
            width: 100%;
            height: 100%;
        }
        .header-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: rgba(0, 15, 30, 0.9);
            color: #ffffff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-bottom: 1px solid rgba(0, 170, 255, 0.4);
        }
        .header-bar h1 {
            font-size: 16px;
            color: #00aaff;
        }
        .header-bar span {
            font-size: 13px;
            color: #cccccc;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>Науковий модуль «Колумб» (Columbus) — МКС</h1>
        <span>Європейське космічне агентство (ESA) • Українська версія</span>
    </div>

    <div id="panorama"></div>

    <script>
        pannellum.viewer('panorama', {
            "type": "equirectangular",
            "panorama": "https://upload.wikimedia.org/wikipedia/commons/8/87/Columbus_module_inside_ISS_360_panorama.jpg",
            "autoLoad": true,
            "autoRotate": -1.5,
            "compass": true,
            "hfov": 100,
            
            "hotSpots": [
                {
                    "pitch": 5,
                    "yaw": -35,
                    "type": "info",
                    "text": "Лабораторія Biolab: біологічні експерименти з мікроорганізмами, клітинами та рослинами в умовах невагомості."
                },
                {
                    "pitch": -8,
                    "yaw": 15,
                    "type": "info",
                    "text": "Лабораторія фізики рідин (Fluid Science Laboratory - FSL): дослідження поведінки та динаміки рідин."
                },
                {
                    "pitch": 2,
                    "yaw": 75,
                    "type": "info",
                    "text": "Європейська стійка для експериментів (EDR): багатоцільова науково-дослідна платформа."
                },
                {
                    "pitch": -12,
                    "yaw": -120,
                    "type": "info",
                    "text": "Стійка фізіології людини (European Physiology Module - EPM): вивчення впливу космічного польоту на організм людини."
                },
                {
                    "pitch": 15,
                    "yaw": -150,
                    "type": "info",
                    "text": "Робоча зона астронавтів: ноутбуки управління, комунікаційні панелі та системи життєзабезпечення."
                }
            ]
        });
    </script>

</body>
</html>
