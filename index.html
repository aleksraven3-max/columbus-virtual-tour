<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Віртуальний тур МКС — Модуль «Колумб»</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b0b;
            font-family: Arial, sans-serif;
        }
        .header-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 45px;
            background: rgba(0, 15, 30, 0.95);
            color: #ffffff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-bottom: 1px solid rgba(0, 170, 255, 0.4);
            font-size: 14px;
        }
        .header-bar h1 {
            font-size: 16px;
            color: #00aaff;
        }
        .tour-container {
            position: absolute;
            top: 45px;
            left: 0;
            width: 100%;
            height: calc(100% - 45px);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>Науковий модуль «Колумб» (Columbus) — МКС</h1>
        <span>Європейське космічне агентство (ESA)</span>
    </div>

    <div class="tour-container">
        <iframe 
            id="esa-iframe"
            src="https://esamultimedia.esa.int/multimedia/virtual-tour-columbus/" 
            allowfullscreen="true" 
            webkitallowfullscreen="true" 
            mozallowfullscreen="true">
        </iframe>
    </div>

    <script>
        // Словник автоматичного перекладу англомовних підказок туру
        const dictionary = {
            "European Physiology Module to investigate the effects of spaceflight on humans.": 
                "Модуль європейської фізіології: дослідження впливу космічного польоту на організм людини.",
            "Biolab": 
                "Біологічна лабораторія Biolab (експерименти з мікроорганізмами, клітинами та рослинами).",
            "Fluid Science Laboratory": 
                "Лабораторія дослідження фізики рідин в умовах невагомості (FSL).",
            "European Drawer Rack": 
                "Європейська стійка для мультидисциплінарних наукових експериментів (EDR).",
            "European Transport Carrier": 
                "Європейський транспортний стелаж для зберігання та транспортування обладнання.",
            "Columbus": 
                "Науковий модуль «Колумб» (Columbus)",
            "MAP ON/OFF": 
                "КАРТА (УВІМК/ВИМК)"
        };

        // Скрипт автоматичної заміни тексту
        function translateTooltip() {
            try {
                const iframe = document.getElementById('esa-iframe');
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

                if (iframeDoc) {
                    const observer = new MutationObserver(() => {
                        const elements = iframeDoc.querySelectorAll('div, span, p, label');
                        elements.forEach(el => {
                            const text = el.innerText ? el.innerText.trim() : '';
                            if (dictionary[text]) {
                                el.innerText = dictionary[text];
                            }
                        });
                    });

                    observer.observe(iframeDoc.body, { childList: true, subtree: true, characterData: true });
                }
            } catch (e) {
                // Виникає у разі крос-доменного обмеження браузера
            }
        }

        document.getElementById('esa-iframe').addEventListener('load', translateTooltip);
    </script>
</body>
</html>
